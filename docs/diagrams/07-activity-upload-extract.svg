opies the file</text><rect fill="#FFFFFF" height="34.584" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="256.7129" x="273.8301" y="616.6775"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="236.7129" x="283.8301" y="638.7419">FileTypeResolver resolves MaterialType</text><rect fill="#FFFFFF" height="49.168" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="229.3262" x="287.5234" y="671.2615"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="202.6523" x="297.5234" y="693.3259">MaterialRepository saves Material</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="209.3262" x="297.5234" y="707.9099">(course, type, path, originalName)</text><rect fill="#FFFFFF" height="34.584" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="112.8594" x="345.7568" y="740.4294"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="92.8594" x="355.7568" y="762.4939">Return Material</text><rect fill="#FFFFFF" height="419.1025" style="stroke:#000000;stroke-width:1;" width="682.252" x="37.9731" y="785.0134"/><path d="M338.5142,785.0134 L338.5142,795.0281 L328.5142,805.0281 L37.9731,805.0281" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="290.541" x="40.9731" y="800.0886">Later: quiz generation reads the material</text><rect fill="#FFFFFF" height="34.584" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="233.5566" x="285.4082" y="822.0281"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="213.5566" x="295.4082" y="844.0925">TextExtractorFactory.forType(type)</text><polygon fill="#FFFFFF" points="343.0186,876.6121,461.3545,876.6121,473.3545,888.6121,461.3545,900.6121,343.0186,900.6121,331.0186,888.6121,343.0186,876.6