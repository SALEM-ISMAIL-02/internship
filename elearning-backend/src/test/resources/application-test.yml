spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  upload-dir: ./uploads-test
  ai:
    provider: openai-compatible
    base-url: http://localhost:9
    api-key: test
    model: test
    max-attempts: 1
    retry-delay-ms: 1
