spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/elearning_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  upload-dir: ./uploads
  ai:
    # Google Gemini via its OpenAI-compatible endpoint (Adapter pattern).
    # Keep the key outside source control: set AI_API_KEY in the process environment.
    provider: ${AI_PROVIDER:openai-compatible}
    base-url: https://generativelanguage.googleapis.com/v1beta/openai
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-flash-latest}
    # Decorator: retry on 5xx / dropped connections (free tiers answer 503 "high demand")
    max-attempts: 3
    retry-delay-ms: 2000

server:
  port: 8080
