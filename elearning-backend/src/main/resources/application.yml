spring:
  datasource:
    url: jdbc:mysql://localhost:3306/elearning_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    secret: "ChangeMe-ThisIsA256BitSecretKeyForJwtSigning-ChangeMe-0123456789"
    expiration-ms: 86400000
  upload-dir: ./uploads
  ai:
    # Google Gemini via its OpenAI-compatible endpoint
    base-url: https://generativelanguage.googleapis.com/v1beta/openai
    api-key: ${AI_API_KEY:REDACTED}
    model: ${AI_MODEL:gemini-flash-latest}

server:
  port: 8080
